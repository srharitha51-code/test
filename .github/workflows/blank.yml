name: 
on:
 workflow_dispatch:
  inputs:
    environments:
     description: "select environments"
     required: true
     default: dev
     type: choice
     options:
      - dev
      - uat
      - test
    artifact_tag:
      description: select git tag to deploy
      required: true
jobs:
  test-inputs:
    runs-on: ubuntu-latest
    steps:
      - run: echo " deploying the $ {{ inputs.artifact_tag}} app into $ {{ inputs.environment}}"
